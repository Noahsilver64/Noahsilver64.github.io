<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Noah's Corner — Admin</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link
    href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=DM+Mono&display=swap"
    rel="stylesheet"
>


<style>

/* =========================================================
   BASE
========================================================= */

* {
    box-sizing: border-box;
}

body {

    margin: 0;

    background: #f4e3a6;

    color: #40251c;

    font-family: "DM Mono", monospace;

}


/* =========================================================
   HEADER
========================================================= */

header {

    background: #40251c;

    color: #f4e3a6;

    padding: 25px 8%;

    display: flex;

    justify-content: space-between;

    align-items: center;

}


header h1 {

    margin: 0;

    font-family: "Archivo Black", sans-serif;

    font-size: 25px;

}


#logoutButton {

    background: #d94f25;

    color: #fff1bb;

    border: 3px solid #fff1bb;

    padding: 10px 18px;

    font-family: "DM Mono", monospace;

    cursor: pointer;

}


#logoutButton:hover {

    background: #f58232;

}


/* =========================================================
   MAIN
========================================================= */

main {

    max-width: 1000px;

    margin: auto;

    padding: 60px 8%;

}


h2 {

    font-family: "Archivo Black", sans-serif;

    color: #d94f25;

    text-shadow: 3px 3px 0 #40251c;

}


/* =========================================================
   LOGIN
========================================================= */

#loginScreen {

    max-width: 500px;

    margin: 100px auto;

    background: #fff1bb;

    border: 4px solid #40251c;

    padding: 40px;

    box-shadow: 9px 9px 0 #d94f25;

}


#loginScreen h1 {

    font-family: "Archivo Black", sans-serif;

    color: #d94f25;

}


input,
textarea {

    width: 100%;

    padding: 13px;

    margin-top: 8px;

    margin-bottom: 20px;

    border: 3px solid #40251c;

    background: #f4e3a6;

    color: #40251c;

    font-family: "DM Mono", monospace;

}


textarea {

    min-height: 220px;

    resize: vertical;

}


button {

    font-family: "DM Mono", monospace;

}


.primary-button {

    background: #40251c;

    color: #fff1bb;

    border: 3px solid #40251c;

    padding: 13px 22px;

    cursor: pointer;

    letter-spacing: 2px;

}


.primary-button:hover {

    background: #613326;

}


.error {

    color: #d94f25;

    font-size: 13px;

}


/* =========================================================
   ADMIN DASHBOARD
========================================================= */

#dashboard {

    display: none;

}


.editor {

    background: #fff1bb;

    border: 4px solid #40251c;

    padding: 35px;

    box-shadow: 9px 9px 0 #d94f25;

    margin-bottom: 60px;

}


.checkbox-row {

    display: flex;

    align-items: center;

    gap: 10px;

    margin-bottom: 25px;

}


.checkbox-row input {

    width: auto;

    margin: 0;

}


.note-list {

    display: grid;

    gap: 20px;

}


.admin-note {

    background: #fff1bb;

    border: 4px solid #40251c;

    padding: 25px;

}


.admin-note h3 {

    margin-top: 0;

    font-family: "Archivo Black", sans-serif;

    color: #d94f25;

}


.admin-note-actions {

    display: flex;

    gap: 10px;

    margin-top: 20px;

    flex-wrap: wrap;

}


.admin-note-actions button {

    padding: 9px 15px;

    border: 2px solid #40251c;

    background: #f4d56a;

    color: #40251c;

    cursor: pointer;

}


.admin-note-actions button:hover {

    background: #f58232;

}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width: 700px) {

    header {

        flex-direction: column;

        gap: 20px;

        text-align: center;

    }

}

</style>

</head>


<body>


<!-- =======================================================
     HEADER
======================================================= -->

<header>

    <h1>
        NOAH'S CORNER / ADMIN
    </h1>

    <button id="logoutButton">
        LOG OUT
    </button>

</header>


<!-- =======================================================
     LOGIN
======================================================= -->

<div id="loginScreen">

    <h1>
        ADMIN LOGIN
    </h1>

    <p>
        This area is for Noah only.
    </p>


    <form id="loginForm">

        <label>
            EMAIL
        </label>

        <input
            type="email"
            id="email"
            required
        >


        <label>
            PASSWORD
        </label>

        <input
            type="password"
            id="password"
            required
        >


        <button
            type="submit"
            class="primary-button"
        >
            LOG IN →
        </button>

    </form>


    <p
        id="loginError"
        class="error"
    ></p>

</div>


<!-- =======================================================
     DASHBOARD
======================================================= -->

<main id="dashboard">

    <h2>
        NOTES
    </h2>


    <!-- ===================================================
         EDITOR
    ==================================================== -->

    <div class="editor">

        <h2 id="editorTitle">
            NEW NOTE
        </h2>


        <label>
            TITLE
        </label>

        <input
            type="text"
            id="noteTitle"
            placeholder="Note title"
        >


        <label>
            CONTENT
        </label>

        <textarea
            id="noteContent"
            placeholder="Write your note..."
        ></textarea>


        <div class="checkbox-row">

            <input
                type="checkbox"
                id="notePublished"
            >

            <label for="notePublished">
                PUBLISH THIS NOTE
            </label>

        </div>


        <button
            class="primary-button"
            id="saveButton"
        >
            PUBLISH NOTE →
        </button>


        <button
            class="primary-button"
            id="cancelButton"
            style="display:none; margin-left:10px;"
        >
            CANCEL
        </button>


        <p
            id="editorMessage"
            class="error"
        ></p>

    </div>


    <!-- ===================================================
         EXISTING NOTES
    ==================================================== -->

    <h2>
        EXISTING NOTES
    </h2>


    <div
        class="note-list"
        id="adminNotes"
    >

        Loading...

    </div>

</main>


<!-- =======================================================
     SUPABASE
======================================================= -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

/* =========================================================
   SUPABASE CONFIG
========================================================= */

const SUPABASE_URL =
    "https://ulvgwwxdywjlfkypjpup.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_4YifUaxT0O7XmErESHZ_lA_pgaZOEUJ";


const supabaseClient =
    supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =========================================================
   ELEMENTS
========================================================= */

const loginScreen =
    document.getElementById(
        "loginScreen"
    );

const dashboard =
    document.getElementById(
        "dashboard"
    );

const loginForm =
    document.getElementById(
        "loginForm"
    );

const loginError =
    document.getElementById(
        "loginError"
    );

const logoutButton =
    document.getElementById(
        "logoutButton"
    );


const noteTitle =
    document.getElementById(
        "noteTitle"
    );

const noteContent =
    document.getElementById(
        "noteContent"
    );

const notePublished =
    document.getElementById(
        "notePublished"
    );

const saveButton =
    document.getElementById(
        "saveButton"
    );

const cancelButton =
    document.getElementById(
        "cancelButton"
    );

const editorTitle =
    document.getElementById(
        "editorTitle"
    );

const editorMessage =
    document.getElementById(
        "editorMessage"
    );

const adminNotes =
    document.getElementById(
        "adminNotes"
    );


let editingNoteId = null;


/* =========================================================
   CHECK LOGIN
========================================================= */

async function checkLogin() {

    const {
        data: {
            session
        }
    } =
        await supabaseClient
        .auth
        .getSession();


    if (session) {

        await verifyAdmin();

    }

}


/* =========================================================
   VERIFY ADMIN
========================================================= */

async function verifyAdmin() {

    const {
        data: {
            user
        }
    } =
        await supabaseClient
        .auth
        .getUser();


    if (!user) {

        showLogin();

        return;

    }


    const {
        data: profile,
        error
    } =
        await supabaseClient

        .from("profiles")

        .select("is_admin")

        .eq(
            "id",
            user.id
        )

        .single();


    if (
        error ||
        !profile ||
        !profile.is_admin
    ) {

        await supabaseClient
            .auth
            .signOut();

        loginError.textContent =
            "You don't have administrator access.";

        showLogin();

        return;

    }


    showDashboard();

}


/* =========================================================
   SHOW LOGIN
========================================================= */

function showLogin() {

    loginScreen.style.display =
        "block";

    dashboard.style.display =
        "none";

}


/* =========================================================
   SHOW DASHBOARD
========================================================= */

function showDashboard() {

    loginScreen.style.display =
        "none";

    dashboard.style.display =
        "block";

    loadAdminNotes();

}


/* =========================================================
   LOGIN
========================================================= */

loginForm.addEventListener(
    "submit",
    async event => {

        event.preventDefault();


        loginError.textContent =
            "";


        const email =
            document
            .getElementById("email")
            .value;


        const password =
            document
            .getElementById("password")
            .value;


        const {
            error
        } =
            await supabaseClient
            .auth
            .signInWithPassword({
                email,
                password
            });


        if (error) {

            loginError.textContent =
                error.message;

            return;

        }


        await verifyAdmin();

    }
);


/* =========================================================
   LOG OUT
========================================================= */

logoutButton.addEventListener(
    "click",
    async () => {

        await supabaseClient
            .auth
            .signOut();

        showLogin();

    }
);


/* =========================================================
   LOAD ADMIN NOTES
========================================================= */

async function loadAdminNotes() {

    const {
        data,
        error
    } =
        await supabaseClient

        .from("notes")

        .select(
            "id, title, content, published, created_at"
        )

        .order(
            "created_at",
            {
                ascending: false
            }
        );


    if (error) {

        adminNotes.innerHTML =
            "<p>Couldn't load notes.</p>";

        console.error(error);

        return;

    }


    if (!data.length) {

        adminNotes.innerHTML =
            "<p>No notes yet.</p>";

        return;

    }


    adminNotes.innerHTML = "";


    data.forEach(note => {

        const element =
            document.createElement(
                "article"
            );


        element.className =
            "admin-note";


        const date =
            new Date(
                note.created_at
            )
            .toLocaleDateString(
                "en-US",
                {
                    year: "numeric",
                    month: "long",
                    day: "numeric"
                }
            );


        element.innerHTML = `

            <div class="card-date">
                ${date}
            </div>

            <h3>
                ${escapeHTML(note.title)}
            </h3>

            <p>
                ${escapeHTML(note.content)}
            </p>

            <strong>
                ${
                    note.published
                    ? "PUBLISHED"
                    : "DRAFT"
                }
            </strong>

            <div class="admin-note-actions">

                <button
                    onclick="editNote(${note.id})"
                >
                    EDIT
                </button>

                <button
                    onclick="togglePublished(
                        ${note.id},
                        ${note.published}
                    )"
                >
                    ${
                        note.published
                        ? "UNPUBLISH"
                        : "PUBLISH"
                    }
                </button>

                <button
                    onclick="deleteNote(${note.id})"
                >
                    DELETE
                </button>

            </div>

        `;


        adminNotes.appendChild(
            element
        );

    });

}


/* =========================================================
   CREATE / UPDATE NOTE
========================================================= */

saveButton.addEventListener(
    "click",
    async () => {

        const title =
            noteTitle.value.trim();

        const content =
            noteContent.value.trim();

        const published =
            notePublished.checked;


        if (!title || !content) {

            editorMessage.textContent =
                "Please enter a title and content.";

            return;

        }


        editorMessage.textContent =
            "";


        let result;


        if (editingNoteId === null) {

            result =
                await supabaseClient
                .from("notes")
                .insert({
                    title,
                    content,
                    published
                });

        } else {

            result =
                await supabaseClient
                .from("notes")
                .update({
                    title,
                    content,
                    published,
                    updated_at:
                        new Date().toISOString()
                })
                .eq(
                    "id",
                    editingNoteId
                );

        }


        if (result.error) {

            editorMessage.textContent =
                result.error.message;

            return;

        }


        resetEditor();

        loadAdminNotes();

    }
);


/* =========================================================
   EDIT NOTE
========================================================= */

async function editNote(id) {

    const {
        data,
        error
    } =
        await supabaseClient

        .from("notes")

        .select("*")

        .eq(
            "id",
            id
        )

        .single();


    if (error) {

        console.error(error);

        return;

    }


    editingNoteId =
        id;


    noteTitle.value =
        data.title;


    noteContent.value =
        data.content;


    notePublished.checked =
        data.published;


    editorTitle.textContent =
        "EDIT NOTE";


    saveButton.textContent =
        "SAVE CHANGES →";


    cancelButton.style.display =
        "inline-block";


    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });

}


/* =========================================================
   TOGGLE PUBLISHED
========================================================= */

async function togglePublished(
    id,
    currentlyPublished
) {

    const {
        error
    } =
        await supabaseClient

        .from("notes")

        .update({
            published:
                !currentlyPublished,

            updated_at:
                new Date().toISOString()
        })

        .eq(
            "id",
            id
        );


    if (error) {

        console.error(error);

        return;

    }


    loadAdminNotes();

}


/* =========================================================
   DELETE NOTE
========================================================= */

async function deleteNote(id) {

    const confirmed =
        confirm(
            "Delete this note permanently?"
        );


    if (!confirmed) {

        return;

    }


    const {
        error
    } =
        await supabaseClient

        .from("notes")

        .delete()

        .eq(
            "id",
            id
        );


    if (error) {

        console.error(error);

        return;

    }


    loadAdminNotes();

}


/* =========================================================
   CANCEL EDITING
========================================================= */

cancelButton.addEventListener(
    "click",
    resetEditor
);


function resetEditor() {

    editingNoteId =
        null;


    noteTitle.value =
        "";


    noteContent.value =
        "";


    notePublished.checked =
        false;


    editorTitle.textContent =
        "NEW NOTE";


    saveButton.textContent =
        "PUBLISH NOTE →";


    cancelButton.style.display =
        "none";


    editorMessage.textContent =
        "";

}


/* =========================================================
   HTML ESCAPING
========================================================= */

function escapeHTML(text) {

    const element =
        document.createElement(
            "div"
        );

    element.textContent =
        text;

    return element.innerHTML;

}


/* =========================================================
   START
========================================================= */

checkLogin();

</script>


</body>

</html>
